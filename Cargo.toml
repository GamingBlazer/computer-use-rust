[package]
name = "desktop-control"
version = "0.3.3"
edition = "2021"
description = "Computer Use (Rust): a fast, safe MCP server that lets any AI agent see and operate every app on Windows"
license = "Apache-2.0"
repository = "https://github.com/GamingBlazer/computer-use-rust"

[[bin]]
name = "desktop-control"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
windows-numerics = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rhai = { version = "1", default-features = false, features = ["std", "no_module"] }
regex = { version = "1", default-features = false, features = ["std", "unicode-case", "unicode-perl", "perf"] }

[dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Com",
    "Win32_System_Variant",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_System_ProcessStatus",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_System_WinRT_Composition",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Media",
    "Win32_System_Diagnostics_Debug",
    "Win32_UI_Shell_Common",
    "Win32_System_LibraryLoader",
    "Win32_System_WinRT_Direct3D11",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Graphics_Imaging",
    "UI_Composition",
    "UI_Composition_Desktop",
    "Foundation",
    "Foundation_Collections",
    "Media_Ocr",
    "Globalization",
    "Storage_Streams",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Direct2D",
    "UI",
    "System",
    "Foundation_Numerics",
    "Security_Authorization_AppCapabilityAccess",
]

[profile.release]
opt-level = 2
lto = "thin"
strip = true
